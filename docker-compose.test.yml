services:
  postgres:
    image: postgres:16-alpine
    container_name: cospace-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: cospace_test
      POSTGRES_PASSWORD: cospace_test_password
      POSTGRES_DB: cospace_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cospace_test -d cospace_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
