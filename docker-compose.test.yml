services:
  postgres:
    image: postgres:16
    container_name: cospace-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: cospace
      POSTGRES_PASSWORD: cospace
      POSTGRES_DB: cospace_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cospace -d cospace_test"]
      interval: 5s
      timeout: 5s
      retries: 10
